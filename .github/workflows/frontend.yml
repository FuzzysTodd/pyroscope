name: frontend
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  group: "frontend-${{ github.ref_name }}-${{ github.head_ref }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  health-check:
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: 'false'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: yarn
      - name: Display Environment Info
        run: |
          echo "::group::Frontend Environment Information"
          echo "Repository: ${{ github.repository }}"
          echo "Node Version: $(node --version)"
          echo "Yarn Version: $(yarn --version)"
          echo "npm Version: $(npm --version)"
          echo "::endgroup::"
  type-check:
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64' || 'ubuntu-latest' }}
    needs: [health-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: 'false'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: |
          echo "::group::Installing dependencies"
          yarn --frozen-lockfile
          echo "::endgroup::"
      - name: Run type-check
        run: |
          echo "::group::Type checking"
          yarn type-check
          echo "::endgroup::"
  format:
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64' || 'ubuntu-latest' }}
    needs: [health-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: 'false'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: |
          echo "::group::Installing dependencies"
          yarn --frozen-lockfile
          echo "::endgroup::"
      - name: Run format
        run: |
          echo "::group::Checking formatting"
          yarn run format
          echo "::endgroup::"
  lint:
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64' || 'ubuntu-latest' }}
    needs: [health-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: 'false'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: |
          echo "::group::Installing dependencies"
          yarn --frozen-lockfile
          echo "::endgroup::"
      - name: Run lint
        run: |
          echo "::group::Linting"
          yarn lint
          echo "::endgroup::"
  build:
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64' || 'ubuntu-latest' }}
    needs: [health-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: 'false'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: |
          echo "::group::Installing dependencies"
          yarn --frozen-lockfile
          echo "::endgroup::"
      - name: Run build
        run: |
          echo "::group::Building frontend"
          yarn build
          echo "::endgroup::"
      - name: Verify build output
        run: |
          # Frontend build outputs to public/build (configured in webpack.common.js)
          if [ ! -d "public/build" ]; then
            echo "::error::Build output directory 'public/build' not found"
            exit 1
          fi
          echo "::notice::Build completed successfully - output in public/build"
